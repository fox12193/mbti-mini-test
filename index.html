<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>八道题的小测试</title>
<style>
  :root{
    --bg:#faf9f7; --fg:#24221f; --muted:#8a8580; --line:#e6e2dc;
    --accent:#7a6a58; --surface:#ffffff;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#151413; --fg:#eae7e2; --muted:#8d8781; --line:#2c2a27;
           --accent:#c2b39f; --surface:#1d1b19; }
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC",sans-serif;
    line-height:1.75; -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:560px; margin:0 auto; padding:56px 24px 80px;}
  h1{font-size:22px; font-weight:600; letter-spacing:.02em; margin:0 0 10px;}
  .lead{color:var(--muted); font-size:14px; margin:0 0 40px;}
  .bar{height:2px; background:var(--line); border-radius:2px; overflow:hidden; margin-bottom:36px;}
  .bar i{display:block; height:100%; width:0; background:var(--accent); transition:width .15s linear;}
  .q{font-size:17px; font-weight:500; margin:0 0 24px;}
  .opts{display:flex; flex-direction:column; gap:12px;}
  button.opt{
    display:block; width:100%; text-align:left; cursor:pointer;
    background:var(--surface); color:var(--fg);
    border:1px solid var(--line); border-radius:14px;
    padding:18px 20px; font-size:15px; line-height:1.6;
    font-family:inherit; transition:opacity .15s linear;
  }
  button.opt:active{opacity:.6;}
  .result{margin-top:8px;}
  .letters{
    font-size:40px; font-weight:600; letter-spacing:.14em;
    margin:0 0 8px; color:var(--accent);
  }
  .gloss{color:var(--muted); font-size:14px; margin:0 0 32px;}
  .row{padding:14px 0; border-top:1px solid var(--line); display:flex; gap:14px; align-items:baseline;}
  .row b{font-size:15px; min-width:26px; color:var(--accent); font-weight:600;}
  .row span{font-size:14px; color:var(--fg); opacity:.85;}
  .foot{margin-top:36px; color:var(--muted); font-size:12px; line-height:1.7;}
  .again{
    margin-top:28px; background:none; border:none; color:var(--muted);
    font-size:13px; font-family:inherit; text-decoration:underline; cursor:pointer; padding:0;
  }
  .hidden{display:none;}
</style>
</head>
<body>
<div class="wrap">
  <h1>八道题的小测试</h1>
  <p class="lead">两个选项，选更像自己的那个。凭第一反应，别想太久。</p>
  <div class="bar" id="bar"><i id="fill"></i></div>

  <div id="quiz"></div>

  <div id="result" class="result hidden">
    <p class="letters" id="code"></p>
    <p class="gloss" id="gloss"></p>
    <div id="rows"></div>
    <p class="foot">这四组字母只是把性格拆成几个方向，不是定论。人比字母软。</p>
    <button class="again" id="again">再测一次</button>
  </div>
</div>

<script>
var QS = [
  {t:"周末空出一整天，你更想",
   a:{k:"I",s:"一个人待着，看点想看的，不安排"},
   b:{k:"E",s:"约人出去，说说话才活起来"}},
  {t:"听完一件事，你脑子里先动的是",
   a:{k:"N",s:"它背后是什么，跟别的事有什么连着"},
   b:{k:"S",s:"具体细节，谁在什么时候做了什么"}},
  {t:"朋友哭着来找你，你先",
   a:{k:"F",s:"先让他哭完，把话吐出来"},
   b:{k:"T",s:"先弄清楚出了什么事，再想怎么办"}},
  {t:"出门前，你通常",
   a:{k:"J",s:"提前想好路线和时间，心里有数"},
   b:{k:"P",s:"走一步看一步，临场决定"}},
  {t:"事情做完没人看见，你",
   a:{k:"F",s:"会有点空，希望有人问一句"},
   b:{k:"T",s:"做完了就是做完了，不图回音"}},
  {t:"读一段话，你更容易被",
   a:{k:"N",s:"它暗含的意思勾住"},
   b:{k:"S",s:"它说得准不准、实不实"}},
  {t:"闹了一晚上，回到家你",
   a:{k:"E",s:"还想再聊两句，人还热着"},
   b:{k:"I",s:"只想安静下来，谁也不理"}},
  {t:"计划突然被打乱，你",
   a:{k:"J",s:"烦躁，想尽快把它按回原样"},
   b:{k:"P",s:"还行，顺手就换了条路"}}
];

var GLOSS = {
  E:"E 从人身上取能量", I:"I 从独处里回血",
  S:"S 信具体的证据", N:"N 看背后的意思",
  T:"T 先讲道理", F:"F 先顾人和情",
  J:"J 喜欢先定下来", P:"P 喜欢留着口子"
};

var idx = 0, score = {E:0,I:0,S:0,N:0,T:0,F:0,J:0,P:0};
var quiz = document.getElementById("quiz");
var fill = document.getElementById("fill");

function render(){
  if(idx >= QS.length){ showResult(); return; }
  var q = QS[idx];
  fill.style.width = (idx / QS.length * 100) + "%";
  quiz.innerHTML = "";
  var h = document.createElement("p");
  h.className = "q"; h.textContent = q.t;
  quiz.appendChild(h);
  var box = document.createElement("div");
  box.className = "opts";
  [q.a, q.b].forEach(function(o){
    var b = document.createElement("button");
    b.className = "opt"; b.type = "button"; b.textContent = o.s;
    b.addEventListener("click", function(){ pick(o.k); });
    box.appendChild(b);
  });
  quiz.appendChild(box);
}

function pick(k){
  score[k]++;
  idx++;
  render();
}

function showResult(){
  fill.style.width = "100%";
  quiz.innerHTML = "";
  var code = (score.E >= score.I ? "E" : "I")
           + (score.N >= score.S ? "N" : "S")
           + (score.F >= score.T ? "F" : "T")
           + (score.J >= score.P ? "J" : "P");
  document.getElementById("code").textContent = code;
  var g = document.getElementById("gloss");
  g.textContent = code.split("").map(function(c){ return GLOSS[c]; }).join(" · ");
  var rows = document.getElementById("rows");
  rows.innerHTML = "";
  code.split("").forEach(function(c){
    var d = document.createElement("div");
    d.className = "row";
    var b = document.createElement("b"); b.textContent = c;
    var s = document.createElement("span"); s.textContent = GLOSS[c].slice(2);
    d.appendChild(b); d.appendChild(s);
    rows.appendChild(d);
  });
  document.getElementById("result").classList.remove("hidden");
}

document.getElementById("again").addEventListener("click", function(){
  idx = 0;
  Object.keys(score).forEach(function(k){ score[k] = 0; });
  document.getElementById("result").classList.add("hidden");
  render();
});

render();
</script>
</body>
</html>
